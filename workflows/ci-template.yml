# 示例 CI 模板 — 复制到各仓库的 .github/workflows/ 下使用
# 各仓库根据实际技术栈调整

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ---- Python 代码检查 ----
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install ruff black

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with black
        run: black --check --diff .

  # ---- C/C++ 格式检查 ----
  lint-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Format check
        run: |
          find . -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' | \
            xargs clang-format --dry-run --Werror

  # ---- Python 测试 ----
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -v
