<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Foray 战队队徽">
  <title>Foray · 肇庆学院 RoboMaster 战队</title>
  <!--
    单色队徽（浅色背景版）：纯黑 #000000 + 透明背景。
    深色背景请用同目录 logo-dark.svg（几何完全相同，仅填充为白色）。
    造型：字母 F 的竖杆即闪电 —— 上端尖锋、两道反向锐利折步、下端尖锋；
          两横为平行四边形（切端与竖杆左缘平行），不使用箭头符号。
    设计坐标包围盒 x 160..440 / y 60..460，整体 translate(-44 -4) 后在 512 画布居中。
  -->
  <g transform="translate(-44 -4)" fill="#000000">
    <!-- 竖杆＝闪电：尖锋 → 折步一 → 折步二 → 尖锋 -->
    <path d="M290 60 L160 308 L250 308 L202 460 L334 268 L280 268 Z"/>
    <!-- 上横：平行四边形，左端落在竖杆左缘上，无缝合并 -->
    <path d="M277 84 L440 84 L411 140 L248 140 Z"/>
    <!-- 中横：同上，更短 -->
    <path d="M233 168 L390 168 L361 224 L204 224 Z"/>
  </g>
</svg>
