<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Foray 战队队徽">
  <title>Foray · 肇庆学院 RoboMaster 战队</title>
  <!--
    单色队徽（深色背景版）：纯白 #FFFFFF + 透明背景。
    浅色背景请用同目录 logo.svg（几何完全相同，仅填充为黑色）。
    设计坐标包围盒 x 124..446 / y 70..470，整体 translate(-29 -14) 后在 512 画布居中。
  -->
  <g transform="translate(-29 -14)" fill="#FFFFFF">
    <!-- 竖杆：上段垂直 → 中部一次锐利折步 → 尾部收成尖锋（即闪电） -->
    <path d="M190 70 L268 70 L268 250 L202 310 L202 430 L163 470 L124 430 L124 310 L190 250 Z"/>
    <!-- 上横：右端 45° 箭头收尖 -->
    <path d="M230 70 L416 70 L446 98 L416 126 L230 126 Z"/>
    <!-- 中横：同角度、更短，保持 F 的比例 -->
    <path d="M230 180 L368 180 L398 208 L368 236 L230 236 Z"/>
  </g>
</svg>
